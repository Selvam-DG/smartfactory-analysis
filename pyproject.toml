[project]
name = "smartfactory-reliability-analytics"
version = "0.1.0"
description = "Privacy-safe industrial reliability analytics platform using Azure PM-style and synthetic tyre manufacturing data."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Selvam DG" }
]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["src", "dashboard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
log_cli = true
log_cli_level = "INFO"
addopts = "-ra"

[tool.coverage.run]
source = ["src"]
omit = [
    "src/ingestion/generate_data.py",
    "src/utils/db.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]